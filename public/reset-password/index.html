<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="referrer" content="no-referrer" />
		<title>Cambiar contraseña — API Demo</title>
		<!-- Se captura y elimina el token de la URL antes de cargar recursos externos. -->
		<script src="/js/password-reset.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="h-full bg-zinc-50 font-sans antialiased text-zinc-900">
		<main class="mx-auto max-w-sm px-4 py-16">
			<a href="/login.html" class="text-sm text-zinc-600 underline underline-offset-2">Volver al inicio de sesión</a>
			<h1 class="mt-6 text-3xl font-semibold tracking-tight">Cambiar contraseña</h1>
			<p class="mt-2 text-sm text-zinc-600">Elige una contraseña nueva. El enlace funciona una sola vez.</p>
			<p id="feedback" role="status" aria-live="polite" aria-atomic="true" class="mt-6 rounded-lg border border-zinc-200 bg-white p-3 text-sm" hidden></p>
			<form id="reset-password-form" class="mt-8 space-y-4" novalidate hidden>
				<div>
					<label for="newPassword" class="mb-1 block text-sm font-medium text-zinc-700">Nueva contraseña</label>
					<input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-help newPassword-error" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900" />
					<p id="password-help" class="mt-1 text-xs text-zinc-500">Entre 8 y 72 caracteres.</p>
					<p id="newPassword-error" class="mt-1 text-xs text-red-700" hidden></p>
				</div>
				<div>
					<label for="confirmPassword" class="mb-1 block text-sm font-medium text-zinc-700">Confirmar nueva contraseña</label>
					<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="confirmPassword-error" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900" />
					<p id="confirmPassword-error" class="mt-1 text-xs text-red-700" hidden></p>
				</div>
				<button type="submit" class="w-full rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-zinc-700 disabled:opacity-50" disabled>Guardar nueva contraseña</button>
			</form>
			<p class="mt-6 text-center text-sm"><a href="/forgot-password/" class="font-medium text-zinc-900 underline underline-offset-2">Solicitar otro enlace</a></p>
			<noscript><p class="mt-4 text-sm text-red-700">Activa JavaScript para usar el enlace de recuperación.</p></noscript>
		</main>
	</body>
</html>
